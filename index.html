<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeatSight — NUEVAYoL</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  height:100%;
}

body{
  font-family:'Syne',sans-serif;
  background:#2f3542;
  color:#f0f0f0;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  gap:12px;
  width:min(100%,1600px);
  margin:0 auto;
  padding:18px;
  overflow:hidden;
}

.header{
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}

.pulse-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#00e5a0;
  animation:pulse 1.2s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.6);
    opacity:.4;
  }
}

.title{
  font-size:20px;
  font-weight:800;
  letter-spacing:.04em;
}

.subtitle{
  margin-left:auto;
  font:11px 'Space Mono',monospace;
  color:#d2d8e2;
}

.track-info{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 12px;
  flex-shrink:0;
  background:rgba(255,255,255,.08);
  border-radius:12px;
}

.track-icon{
  font-size:18px;
}

.track-name{
  font-size:14px;
  font-weight:700;
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.track-dur{
  font-size:11px;
  color:#c3cad5;
  font-family:'Space Mono',monospace;
}

.mode-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.mode-btn{
  font-size:10px;
  font-family:'Space Mono',monospace;
  padding:5px 12px;
  border-radius:20px;
  border:.5px solid #4b5568;
  background:transparent;
  color:#d2d8e2;
  cursor:pointer;
  transition:all .15s;
}

.mode-btn.active{
  border-color:#00e5a0;
  color:#00e5a0;
  background:rgba(0,229,160,.10);
}

.media-stage{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(420px,.82fr);
  gap:12px;
  flex:1 1 auto;
  min-height:0;
}

.viz-container,
.video-panel{
  background:rgba(255,255,255,.06);
  border-radius:16px;
  border:.5px solid #40495a;
  overflow:hidden;
  position:relative;
  min-height:0;
}

.video-column{
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:12px;
  min-height:0;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

.youtube-frame{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#111827;
}

.video-zoom-controls{
  position:absolute;
  top:10px;
  right:10px;
  display:flex;
  gap:6px;
  z-index:10;
}

.video-zoom-controls button{
  width:28px;
  height:28px;
  border-radius:8px;
  border:none;
  background:rgba(0,0,0,.6);
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.video-zoom-controls button:hover{
  background:rgba(0,0,0,.82);
}

.controls{
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}

.play-btn{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#00e5a0;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .15s,background .15s;
}

.play-btn:hover{
  transform:scale(1.05);
  background:#00ffb3;
}

.play-btn:active{
  transform:scale(.95);
}

.play-btn svg{
  fill:#0a0a0f;
}

.progress-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.time-row{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#d2d8e2;
  font-family:'Space Mono',monospace;
}

.progress-bar{
  height:6px;
  background:#4b5568;
  border-radius:999px;
  cursor:pointer;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,#00e5a0,#00b4ff);
}

@media (max-width:980px){

  body{
    overflow:auto;
  }

  .media-stage{
    grid-template-columns:1fr;
  }

  .video-column{
    grid-template-rows:300px 300px;
  }
}

</style>
</head>

<body>

<div class="header">
  <div class="pulse-dot"></div>
  <span class="title">BeatSight</span>
  <span class="subtitle">NUEVAYoL</span>
</div>

<div class="track-info">
  <span class="track-icon">♫</span>
  <span class="track-name">NUEVAYoL-BAD BUNNY</span>
  <span class="track-dur" id="trackDur">0:00</span>
</div>

<div class="mode-row">
  <button class="mode-btn active">WAVE</button>
  <button class="mode-btn">BARS</button>
  <button class="mode-btn">RADIAL</button>
  <button class="mode-btn">SPECTRUM</button>
  <button class="mode-btn">SCOPE</button>
  <button class="mode-btn">MIRROR</button>
  <button class="mode-btn">STEREO</button>
  <button class="mode-btn">FREQ</button>
  <button class="mode-btn">STACK</button>
  <button class="mode-btn">LINE</button>
</div>

<div class="media-stage">

  <!-- VISUALIZER -->

  <div class="viz-container">
    <canvas id="vizCanvas"></canvas>
  </div>

  <!-- RIGHT STACKED VIDEO COLUMN -->

  <div class="video-column">

    <!-- DANCE PRACTICE VIDEO -->

    <div class="video-panel">

      <iframe
        id="danceFrame"
        class="youtube-frame"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
        src="https://www.youtube.com/embed/ptR5BApop8g?enablejsapi=1&playsinline=1&autoplay=0&mute=1&controls=1&rel=0&modestbranding=1&showinfo=0&iv_load_policy=3">
      </iframe>

    </div>

    <!-- MAIN YOUTUBE VIDEO -->

    <div class="video-panel">

      <div class="video-zoom-controls">
        <button id="zoomOut">−</button>
        <button id="zoomIn">+</button>
      </div>

      <iframe
        id="youtubeFrame"
        class="youtube-frame"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
        src="https://www.youtube.com/embed/L-S3h8jWTEU?enablejsapi=1&playsinline=1&autoplay=0&mute=1&controls=1&rel=0&modestbranding=1&showinfo=0&iv_load_policy=3">
      </iframe>

    </div>

  </div>

</div>

<div class="controls">

  <button class="play-btn" id="playBtn">

    <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"/>
    </svg>

  </button>

  <div class="progress-wrap">

    <div class="time-row">
      <span id="curTime">0:00</span>
      <span id="totTime">0:00</span>
    </div>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

  </div>

</div>

<audio
  id="audioEl"
  preload="auto"
  crossorigin="anonymous"
  src="NUEVAYoL-BAD BUNNY.mp3">
</audio>

<script>

const audioEl = document.getElementById('audioEl');

const playBtn = document.getElementById('playBtn');

const playIcon = document.getElementById('playIcon');

const progressFill = document.getElementById('progressFill');

const curTimeEl = document.getElementById('curTime');

const totTimeEl = document.getElementById('totTime');

const progressBar = document.getElementById('progressBar');

const youtubeFrame = document.getElementById('youtubeFrame');

const danceFrame = document.getElementById('danceFrame');

function fmt(s){

  s = Math.max(0,Math.floor(Number(s)||0));

  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function ytCommand(frame,func,args=[]){

  frame.contentWindow.postMessage(JSON.stringify({
    event:'command',
    func:func,
    args:args
  }),'*');
}

function syncAllVideos(time){

  ytCommand(youtubeFrame,'seekTo',[time,true]);

  ytCommand(danceFrame,'seekTo',[time,true]);
}

function playAllVideos(){

  ytCommand(youtubeFrame,'playVideo');

  ytCommand(danceFrame,'playVideo');

  ytCommand(danceFrame,'mute');
}

function pauseAllVideos(){

  ytCommand(youtubeFrame,'pauseVideo');

  ytCommand(danceFrame,'pauseVideo');
}

audioEl.addEventListener('loadedmetadata',()=>{

  totTimeEl.textContent = fmt(audioEl.duration);
});

audioEl.addEventListener('timeupdate',()=>{

  const t = audioEl.currentTime;

  const d = audioEl.duration;

  curTimeEl.textContent = fmt(t);

  if(d>0){

    progressFill.style.width = ((t/d)*100)+'%';
  }
});

audioEl.addEventListener('play',()=>{

  playAllVideos();

  playIcon.innerHTML =
    '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
});

audioEl.addEventListener('pause',()=>{

  pauseAllVideos();

  playIcon.innerHTML =
    '<path d="M8 5v14l11-7z"/>';
});

audioEl.addEventListener('seeked',()=>{

  syncAllVideos(audioEl.currentTime);
});

playBtn.addEventListener('click',async()=>{

  if(audioEl.paused){

    await audioEl.play();

  }else{

    audioEl.pause();
  }
});

progressBar.addEventListener('click',e=>{

  const rect = progressBar.getBoundingClientRect();

  const ratio = (e.clientX - rect.left)/rect.width;

  audioEl.currentTime = ratio * audioEl.duration;
});

window.addEventListener('load',()=>{

  ytCommand(danceFrame,'mute');
});

</script>

</body>
</html>
