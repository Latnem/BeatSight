<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeatSight</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Michroma&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  height:100%;
}

body{
  font-family:'Space Mono',monospace;
  background:#2f3542;
  color:#f0f0f0;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  gap:12px;
  width:min(100%,1800px);
  margin:0 auto;
  padding:18px;
  overflow:hidden;
}

.header{
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
  flex-wrap:wrap;
}

.pulse-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#00e5a0;
  animation:pulse 1.2s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.6);
    opacity:.4;
  }
}

.title{
  font-family:'Michroma',sans-serif;
  font-size:20px;
  letter-spacing:.08em;
  display:flex;
  align-items:center;
  gap:0;
}

.title-bold{
  font-weight:700;
}

.title-light{
  font-weight:400;
  opacity:.88;
}

.mode-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-left:18px;
  align-items:center;
}

.mode-btn{
  font-size:10px;
  font-family:'Space Mono',monospace;
  padding:5px 12px;
  border-radius:20px;
  border:.5px solid #4b5568;
  background:transparent;
  color:#d2d8e2;
  cursor:pointer;
  transition:all .15s;
}

.mode-btn.active{
  border-color:#00e5a0;
  color:#00e5a0;
  background:rgba(0,229,160,.10);
}

.media-stage{
  display:grid;
  grid-template-columns:minmax(0,.8fr) minmax(820px,1.5fr);
  gap:12px;
  flex:1 1 auto;
  min-height:0;
}

.viz-container,
.video-panel{
  background:rgba(255,255,255,.06);
  border-radius:16px;
  border:.5px solid #40495a;
  overflow:hidden;
  position:relative;
  min-height:0;
}

.video-column{
  display:block;
  min-height:0;
}

.video-panel{
  height:100%;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

.youtube-frame{
  width:100%;
  height:100%;
  min-height:100%;
  border:0;
  display:block;
  background:#111827;
}

.video-zoom-controls{
  position:absolute;
  top:10px;
  right:10px;
  display:flex;
  gap:6px;
  z-index:10;
}

.video-zoom-controls button{
  width:28px;
  height:28px;
  border-radius:8px;
  border:none;
  background:rgba(0,0,0,.6);
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.video-zoom-controls button:hover{
  background:rgba(0,0,0,.82);
}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  min-height:36px;
}

.play-btn{
  width:32px;
  height:32px;
  min-width:32px;
  min-height:32px;
  border-radius:50%;
  background:#00e5a0;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .15s,background .15s;
  flex-shrink:0;
  padding:0;
  z-index:5;
}

.play-btn:hover{
  transform:scale(1.05);
  background:#00ffb3;
}

.play-btn:active{
  transform:scale(.95);
}

.play-btn svg{
  fill:#0a0a0f;
}

.progress-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.time-row{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#d2d8e2;
  font-family:'Space Mono',monospace;
}

.progress-bar{
  height:6px;
  background:#4b5568;
  border-radius:999px;
  cursor:pointer;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,#00e5a0,#00b4ff);
}

@media (max-width:980px){

  body{
    overflow:auto;
  }

  .media-stage{
    grid-template-columns:1fr;
  }

  .mode-row{
    margin-left:0;
  }

  .video-panel{
    min-height:420px;
  }
}

</style>
</head>

<body>

<div class="header">

  <div class="pulse-dot"></div>

  <span class="title">
    <span class="title-bold">Beat</span><span class="title-light">Sight</span>
  </span>

  <div class="mode-row">

    <button class="mode-btn active" data-mode="wave">WAVE</button>
    <button class="mode-btn" data-mode="bars">BARS</button>
    <button class="mode-btn" data-mode="radial">RADIAL</button>
    <button class="mode-btn" data-mode="spectrum">SPECTRUM</button>
    <button class="mode-btn" data-mode="scope">SCOPE</button>
    <button class="mode-btn" data-mode="mirror">MIRROR</button>
    <button class="mode-btn" data-mode="stereo">STEREO</button>
    <button class="mode-btn" data-mode="freq">FREQ</button>
    <button class="mode-btn" data-mode="stack">STACK</button>
    <button class="mode-btn" data-mode="line">LINE</button>

  </div>

</div>

<div class="media-stage">

  <div class="viz-container">
    <canvas id="vizCanvas"></canvas>
  </div>

  <div class="video-column">

    <div class="video-panel">

      <iframe
        id="youtubeFrame"
        class="youtube-frame"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
        src="https://www.youtube.com/embed/L-S3h8jWTEU?enablejsapi=1&playsinline=1&autoplay=0&mute=1&controls=1&rel=0&modestbranding=1&showinfo=0&iv_load_policy=3">
      </iframe>

    </div>

  </div>

</div>

<div class="controls">

  <button class="play-btn" id="playBtn">

    <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"/>
    </svg>

  </button>

  <div class="progress-wrap">

    <div class="time-row">
      <span id="curTime">0:00</span>
      <span id="totTime">0:00</span>
    </div>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

  </div>

</div>

<audio
  id="audioEl"
  preload="auto"
  crossorigin="anonymous"
  src="NUEVAYoL-BAD BUNNY.mp3">
</audio>

<script>

const audioEl = document.getElementById('audioEl');

const playBtn = document.getElementById('playBtn');

const playIcon = document.getElementById('playIcon');

const progressFill = document.getElementById('progressFill');

const curTimeEl = document.getElementById('curTime');

const totTimeEl = document.getElementById('totTime');

const progressBar = document.getElementById('progressBar');

const youtubeFrame = document.getElementById('youtubeFrame');

const canvas = document.getElementById('vizCanvas');

const ctx = canvas.getContext('2d');

let audioCtx;
let analyser;
let source;
let animationId;
let vizMode = 'wave';

function resizeCanvas(){

  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}

window.addEventListener('resize',resizeCanvas);

resizeCanvas();

function setupAudio(){

  if(audioCtx) return;

  audioCtx = new(window.AudioContext||window.webkitAudioContext)();

  analyser = audioCtx.createAnalyser();

  analyser.fftSize = 2048;

  source = audioCtx.createMediaElementSource(audioEl);

  source.connect(analyser);

  analyser.connect(audioCtx.destination);
}

function drawVisualizer(){

  animationId = requestAnimationFrame(drawVisualizer);

  const bufferLength = analyser.frequencyBinCount;

  const dataArray = new Uint8Array(bufferLength);

  analyser.getByteFrequencyData(dataArray);

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(vizMode === 'bars') drawBars(dataArray);
  else if(vizMode === 'radial') drawRadial(dataArray);
  else if(vizMode === 'spectrum') drawSpectrum(dataArray);
  else drawWave(dataArray);
}

function drawWave(data){

  ctx.beginPath();

  ctx.strokeStyle = '#00e5a0';

  ctx.lineWidth = 2;

  const slice = canvas.width / data.length;

  let x = 0;

  for(let i=0;i<data.length;i++){

    const y = (data[i]/255) * canvas.height;

    if(i===0){
      ctx.moveTo(x,y);
    }else{
      ctx.lineTo(x,y);
    }

    x += slice;
  }

  ctx.stroke();
}

function drawBars(data){

  const barWidth = (canvas.width / data.length) * 2.5;

  let x = 0;

  for(let i=0;i<data.length;i++){

    const barHeight = data[i] * 1.2;

    ctx.fillStyle = '#00e5a0';

    ctx.fillRect(
      x,
      canvas.height - barHeight,
      barWidth,
      barHeight
    );

    x += barWidth + 1;
  }
}

function drawRadial(data){

  const cx = canvas.width/2;
  const cy = canvas.height/2;

  ctx.strokeStyle = '#00e5a0';

  for(let i=0;i<data.length;i+=8){

    const angle = i * 0.1;

    const radius = data[i] * 0.8;

    const x = cx + Math.cos(angle) * radius;

    const y = cy + Math.sin(angle) * radius;

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(x,y);
    ctx.stroke();
  }
}

function drawSpectrum(data){

  for(let i=0;i<data.length;i+=4){

    const height = data[i] * 1.5;

    ctx.fillStyle = `hsl(${i},100%,50%)`;

    ctx.fillRect(
      i*2,
      canvas.height-height,
      3,
      height
    );
  }
}

function fmt(s){

  s = Math.max(0,Math.floor(Number(s)||0));

  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function ytCommand(frame,func,args=[]){

  frame.contentWindow.postMessage(JSON.stringify({
    event:'command',
    func:func,
    args:args
  }),'*');
}

function syncVideo(time){

  ytCommand(youtubeFrame,'seekTo',[time,true]);
}

function playVideo(){

  ytCommand(youtubeFrame,'playVideo');
}

function pauseVideo(){

  ytCommand(youtubeFrame,'pauseVideo');
}

audioEl.addEventListener('loadedmetadata',()=>{

  totTimeEl.textContent = fmt(audioEl.duration);
});

audioEl.addEventListener('timeupdate',()=>{

  const t = audioEl.currentTime;

  const d = audioEl.duration;

  curTimeEl.textContent = fmt(t);

  if(d>0){

    progressFill.style.width = ((t/d)*100)+'%';
  }
});

audioEl.addEventListener('play',()=>{

  playVideo();

  playIcon.innerHTML =
    '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

  setupAudio();

  drawVisualizer();
});

audioEl.addEventListener('pause',()=>{

  pauseVideo();

  playIcon.innerHTML =
    '<path d="M8 5v14l11-7z"/>';

  cancelAnimationFrame(animationId);
});

audioEl.addEventListener('seeked',()=>{

  syncVideo(audioEl.currentTime);
});

playBtn.addEventListener('click',async()=>{

  if(audioEl.paused){

    await audioEl.play();

  }else{

    audioEl.pause();
  }
});

progressBar.addEventListener('click',e=>{

  const rect = progressBar.getBoundingClientRect();

  const ratio = (e.clientX - rect.left)/rect.width;

  audioEl.currentTime = ratio * audioEl.duration;
});

document.querySelectorAll('.mode-btn').forEach(btn=>{

  btn.addEventListener('click',()=>{

    document.querySelectorAll('.mode-btn')
      .forEach(b=>b.classList.remove('active'));

    btn.classList.add('active');

    vizMode = btn.dataset.mode;
  });
});

</script>

</body>
</html>
